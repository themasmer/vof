<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .button {
            border:solid 1px #007BFF;
            color: #007BFF;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 20px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Password Reset Request</h2>
        <p>Hello {{first_name}},</p>
        <p>We received a request to reset your password. If this was you, please click the button below to reset your password.</p>

        <a href="{{reset_link}}" target="_blank" class="button">Reset Password</a>

        <p>If you didn't request a password reset, you can safely ignore this email.</p>

        <p>Thank you,<br />{{Your_Company}} Team</p>
    </div>
</body>

</html>
